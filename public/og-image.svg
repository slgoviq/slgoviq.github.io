<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010736" />
      <stop offset="50%" stop-color="#0D1C42" />
      <stop offset="100%" stop-color="#010736" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22396F" />
      <stop offset="100%" stop-color="#FCF1D0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#22396F" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle decorative circles -->
  <circle cx="1080" cy="120" r="240" fill="#22396F" fill-opacity="0.15" />
  <circle cx="120" cy="540" r="180" fill="#22396F" fill-opacity="0.1" />

  <!-- Brand Badge & Logo -->
  <g transform="translate(80, 75)">
    <!-- Logo Icon Box -->
    <rect width="64" height="64" rx="16" fill="#FCF1D0" />
    <g transform="translate(12, 12)" stroke="#010736" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="20,4 38,13 20,22 2,13" />
      <path d="M10 18v8c0 5 10 7 20 0v-8" />
      <path d="M38 13v15" />
    </g>
    <!-- Brand Name -->
    <text x="82" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FCF1D0" letter-spacing="1">SLGovIQ</text>
    
    <!-- Pro / Free Badge -->
    <rect x="252" y="16" width="130" height="34" rx="17" fill="#22396F" />
    <text x="317" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FCF1D0" text-anchor="middle">100% FREE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Sinhala IQ Papers
  </text>
  <text x="80" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FCF1D0" letter-spacing="-0.5">
    Sri Lanka Gov Exam Practice Portal
  </text>

  <!-- Sinhala Subtitle -->
  <text x="80" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#FCF1D0" fill-opacity="0.85">
    රාජ්‍ය සේවා තරඟ විභාග බුද්ධි පරීක්ෂණ ගැටලු හා කෙටි ක්‍රම (SLAS &amp; Banking)
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 400)">
    <!-- Pill 1: Timed Engine -->
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#0D1C42" stroke="#22396F" stroke-width="1.5" />
    <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCF1D0" text-anchor="middle">⏱️ Real Exam Timers</text>

    <!-- Pill 2: Short Methods -->
    <rect x="236" y="0" width="240" height="52" rx="14" fill="#0D1C42" stroke="#22396F" stroke-width="1.5" />
    <text x="356" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCF1D0" text-anchor="middle">⚡ High-Speed Methods</text>

    <!-- Pill 3: Instant Scores -->
    <rect x="492" y="0" width="230" height="52" rx="14" fill="#0D1C42" stroke="#22396F" stroke-width="1.5" />
    <text x="607" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCF1D0" text-anchor="middle">🎯 Instant Scoring</text>

    <!-- Pill 4: Trilingual -->
    <rect x="738" y="0" width="270" height="52" rx="14" fill="#0D1C42" stroke="#22396F" stroke-width="1.5" />
    <text x="873" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCF1D0" text-anchor="middle">🌐 English • සිංහල • தமிழ்</text>
  </g>

  <!-- Target Exam Badges Bottom Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#22396F" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCF1D0" fill-opacity="0.8">
      Targeting: SLAS • Banking (BOC / People's / NSB) • Development Officers • Teachers' Exam
    </text>
    <text x="1040" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FCF1D0" text-anchor="end">
      https://slgoviq.github.io
    </text>
  </g>
</svg>
